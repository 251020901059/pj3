<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An accessible interactive photo gallery">
  <title>Accessible Interactive Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-container">
    <header class="page-header">
      <p class="eyebrow">Visual collection</p>
      <h1>Accessible Interactive Photo Gallery</h1>
      <p class="intro">Hover over an image or use the Tab key to explore the gallery.</p>
    </header>

    <section class="gallery-section" aria-labelledby="gallery-heading">
      <h2 id="gallery-heading">Featured photographs</h2>
      <div id="display-area" class="display-area" aria-live="polite">
        <p id="display-title">Select a photograph</p>
        <p id="display-description">Place your pointer over an image or focus it with the keyboard.</p>
      </div>

      <div id="gallery" class="gallery">
        <img class="gallery-image" src="https://picsum.photos/id/1015/800/600" alt="A green mountain valley beneath a cloudy blue sky with a calm river in the foreground" data-title="Mountain Valley" data-description="A peaceful river leads through a green mountain valley beneath a cloudy blue sky." onmouseover="upDate(this)" onmouseleave="unDo(this)" onfocus="upDate(this)" onblur="unDo(this)">
        <img class="gallery-image" src="https://picsum.photos/id/1016/800/600" alt="A rugged gray mountain peak rising behind a forest of tall evergreen trees" data-title="Forest Peak" data-description="A rugged gray peak rises above a dense evergreen forest." onmouseover="upDate(this)" onmouseleave="unDo(this)" onfocus="upDate(this)" onblur="unDo(this)">
        <img class="gallery-image" src="https://picsum.photos/id/1025/800/600" alt="A brown and white dog looking attentively toward the camera outdoors" data-title="Curious Companion" data-description="A friendly brown and white dog looks attentively toward the camera." onmouseover="upDate(this)" onmouseleave="unDo(this)" onfocus="upDate(this)" onblur="unDo(this)">
        <img class="gallery-image" src="https://picsum.photos/id/1035/800/600" alt="A wide turquoise lake surrounded by dark green hills and distant mountains" data-title="Turquoise Lake" data-description="A bright turquoise lake is surrounded by green hills and distant mountains." onmouseover="upDate(this)" onmouseleave="unDo(this)" onfocus="upDate(this)" onblur="unDo(this)">
        <img class="gallery-image" src="https://picsum.photos/id/1043/800/600" alt="A close view of golden grass and wild plants glowing in warm sunlight" data-title="Golden Meadow" data-description="Sunlight gives tall golden grass and wild plants a warm glow." onmouseover="upDate(this)" onmouseleave="unDo(this)" onfocus="upDate(this)" onblur="unDo(this)">
        <img class="gallery-image" src="https://picsum.photos/id/1069/800/600" alt="A deep blue ocean meeting a rocky shoreline under a pale evening sky" data-title="Rocky Shoreline" data-description="Deep blue water meets a rocky shoreline beneath a soft evening sky." onmouseover="upDate(this)" onmouseleave="unDo(this)" onfocus="upDate(this)" onblur="unDo(this)">
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
